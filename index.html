<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 180 180%22%3E%3Crect width=%22180%22 height=%22180%22 rx=%2240%22 fill=%22%230F172A%22/%3E%3Crect x=%2230%22 y=%2278%22 width=%22120%22 height=%2224%22 rx=%226%22 fill=%22%233B82F6%22/%3E%3Crect x=%2218%22 y=%2258%22 width=%2222%22 height=%2264%22 rx=%228%22 fill=%22%23F1F5F9%22/%3E%3Crect x=%22140%22 y=%2258%22 width=%2222%22 height=%2264%22 rx=%228%22 fill=%22%23F1F5F9%22/%3E%3C/svg%3E">
<title>Mezocykl — masa</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070B18;--bg2:#0B1330;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.035);
      --ink:#EAF0FF;--soft:#8894B5;--line:rgba(255,255,255,.11);--hair:rgba(255,255,255,.07);
      --acc:#3E8EFF;--acc2:#A855F7;--grad:linear-gradient(90deg,var(--acc),var(--acc2));
      --ok:#34D399;--warn:#FBBF24;--red:#FB7185;--purple:#A855F7;--alert:#FB7185}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{touch-action:manipulation;color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;
     line-height:1.45;padding-bottom:calc(20px + env(safe-area-inset-bottom));
     background:var(--bg);
     background-image:radial-gradient(600px 500px at 100% 0%,rgba(168,85,247,.16),transparent 60%),
                       radial-gradient(500px 460px at 0% 30%,rgba(62,142,255,.14),transparent 60%),
                       linear-gradient(180deg,#070B18 0%,#0B1330 55%,#0A1024 100%);
     background-attachment:fixed;min-height:100vh}
h1,h2,h3,.n,.g{font-family:"Space Grotesk",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(7,11,24,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
       border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{padding:12px 14px 6px;display:flex;justify-content:space-between;align-items:center}
.hd h1{font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.pill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--grad);color:#08101F;font-family:"Space Mono",monospace}
.pill.ok{background:var(--grad);color:#08101F}.pill.err{background:var(--red);color:#08101F}
.weeks{display:flex;gap:6px;padding:2px 14px 8px;overflow-x:auto}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);
    font-size:12px;font-family:"Space Mono",monospace;color:var(--soft);cursor:pointer;white-space:nowrap}
.wk.on{background:var(--grad);border-color:transparent;color:#08101F;font-weight:700}
.wk.dl.on{background:var(--ok);border-color:var(--ok);color:#08101F}
.wk.tt.on{background:var(--warn);border-color:var(--warn);color:#08101F}
.days{display:flex;gap:6px;padding:0 14px 10px}
.dy{flex:1;padding:9px 3px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    text-align:center;font-size:12.5px;font-weight:600;color:var(--soft);cursor:pointer}
.dy.on{background:rgba(62,142,255,.16);border-color:var(--acc);color:var(--ink)}
.dy small{display:block;font-size:9px;font-weight:400;opacity:.75;margin-top:1px}
.banner{margin:12px 14px;padding:13px 14px;border-radius:16px;font-size:13px;line-height:1.55;
        background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
        box-shadow:0 10px 30px rgba(0,0,0,.28)}
.banner.test{background:rgba(251,191,36,.09);border-color:rgba(251,191,36,.35)}
.banner.dload{background:rgba(52,211,153,.09);border-color:rgba(52,211,153,.35)}
.banner b{color:var(--ink)}
.rir{font-family:"Space Mono",monospace;font-size:19px;font-weight:700;
     background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.legend{margin:12px 14px;padding:12px 13px;border-radius:14px;background:var(--card2);
        border:1px solid var(--line);font-size:11.5px;color:var(--soft);line-height:1.7}
.k{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.ex{margin:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.ex.prio{box-shadow:0 10px 30px rgba(0,0,0,.28),inset 3px 0 0 var(--purple)}
.exh{padding:13px 14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}
.exh h3{font-size:15.5px;font-weight:600;line-height:1.25;font-family:"IBM Plex Sans",sans-serif}
.exh .m{font-size:11px;color:var(--soft);margin-top:2px}
.badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
       padding:3px 7px;border-radius:20px;margin-top:6px;border:1px solid}
.b0{background:rgba(255,255,255,.05);color:var(--soft);border-color:var(--line)}
.b2{background:rgba(62,142,255,.15);color:#BFD8FF;border-color:rgba(62,142,255,.45)}
.b3{background:rgba(52,211,153,.14);color:#9CF2D3;border-color:rgba(52,211,153,.4)}
.b4{background:rgba(217,131,255,.16);color:#EBC4FF;border-color:rgba(217,131,255,.45)}
.rest{font-size:10px;color:#6D7999;margin-top:5px}.rest b{color:var(--soft)}
.tgt{text-align:right;flex:0 0 auto}
.tgt .s{font-family:"Space Mono",monospace;font-size:19px;font-weight:700;
        background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.tgt .r{font-size:10px;color:#6D7999;margin-top:4px;white-space:nowrap}
.info{padding:0 13px 12px;font-size:12px;color:var(--soft);line-height:1.55;display:none}
.info.on{display:block}.info .lead{color:var(--ink);margin-bottom:6px}
.warm{background:var(--card2);border-radius:12px;padding:9px 11px;font-size:11.5px;border:1px solid var(--hair)}
.sets{padding:0 13px 12px}
.lbl{display:grid;grid-template-columns:30px 1fr 1fr;gap:8px;margin-bottom:6px}
.lbl span{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#6D7999;text-align:center}
.row{display:grid;grid-template-columns:30px 1fr 1fr;gap:8px;align-items:center;margin-bottom:7px}
.row .i{font-family:"Space Mono",monospace;font-size:12.5px;color:#8894B5;text-align:center;font-weight:600}
.row input{width:100%;padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card2);
           color:var(--ink);font-size:16px;text-align:center;font-family:"Space Mono",monospace;font-weight:700}
.row input:focus{outline:none;border-color:var(--acc);background:rgba(62,142,255,.09)}
.row input::placeholder{color:#4B5578;font-weight:400}
.uw{width:100%;margin-top:8px;padding:9px 11px;border-radius:12px;border:1px solid var(--line);
    background:var(--card2);color:var(--ink);font-size:12.5px;font-family:inherit}
.uw:focus{outline:none;border-color:var(--acc)}
.uw::placeholder{color:#4B5578}
.prev{font-size:10.5px;color:#6D7999;text-align:center;padding-top:3px}.prev b{color:var(--warn)}
.doc{margin:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
     backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.doc h2{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;
        background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.doc h2:not(:first-child){margin-top:20px}
.doc p{font-size:13px;color:var(--soft);margin-bottom:8px;line-height:1.6}.doc b{color:var(--ink)}
.doc table{width:100%;border-collapse:collapse;margin:8px 0}
.doc td,.doc th{padding:6px 4px;font-size:12.5px;border-bottom:1px solid var(--hair);text-align:right}
.doc td:first-child,.doc th:first-child{text-align:left}
.doc th{color:#6D7999;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.doc .n{font-weight:700;font-size:14px;color:var(--ink);font-family:"Space Mono",monospace}
.btn{display:block;width:100%;padding:12px;margin-top:8px;border-radius:12px;border:1px solid var(--line);
     background:var(--card2);color:var(--ink);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.btn.g{background:var(--grad);border-color:transparent;color:#08101F;font-weight:700}
textarea{width:100%;height:110px;margin-top:8px;padding:10px;border-radius:12px;border:1px solid var(--line);
         background:var(--card2);color:var(--ink);font-size:11px;font-family:ui-monospace,monospace}
/* ---- dieta ---- */
.dcard{margin:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
       backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.dhead{padding:11px 13px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line)}
.dhead h3{font-family:"Space Grotesk",sans-serif;font-size:15.5px;font-weight:700;letter-spacing:.01em}
.dhead .cel{font-size:11.5px;color:var(--soft);margin-top:2px}
.dhead .cel b{color:var(--ink);font-family:"Space Mono",monospace;font-size:13px;font-weight:700}
.dwrap{display:grid;grid-template-columns:1fr 1fr}
.dwrap.one{grid-template-columns:1fr}
.dv{min-width:0}
.dv+.dv{border-left:1px solid var(--line)}
.dvh{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:700;letter-spacing:.09em;
     text-transform:uppercase;color:#08101F;padding:5px 11px;background:var(--grad)}
.dgrp{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);
      padding:9px 11px 3px;background:rgba(255,255,255,.025)}
.dgrp span{font-family:"IBM Plex Sans",sans-serif;font-weight:400;letter-spacing:0;text-transform:none;
           color:#6D7999;font-size:10px}
.drow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:baseline;
      padding:4px 11px;border-top:1px solid var(--hair);font-size:11.5px}
.drow:first-of-type{border-top:none}
.drow .nm{line-height:1.3;min-width:0}
.drow .nm em{display:block;font-style:normal;font-size:9.5px;color:#6D7999;margin-top:1px}
.drow .v{font-family:"Space Mono",monospace;font-size:13.5px;font-weight:700;white-space:nowrap;text-align:right}
.drow .v i{display:block;font-style:normal;font-size:9.5px;font-weight:400;color:#6D7999;font-family:"IBM Plex Sans",sans-serif}
.dnote{padding:8px 11px 10px;font-size:10.5px;color:var(--alert);line-height:1.45}
@media (max-width:700px){ .dwrap{grid-template-columns:1fr} .dv+.dv{border-left:none;border-top:1px solid var(--line)} }
</style>
</head>
<body>
<header>
  <div class="hd"><h1>Mezocykl — masa</h1><span class="pill" id="pill">80 → 84 kg</span></div>
  <div class="days" id="top"></div>
  <div class="weeks" id="weeks"></div>
  <div class="days" id="days" style="padding-bottom:10px"></div>
  </header>
<main id="main"></main>
<script>
const PLAN={
  A: [
    { n: "Wyciskanie sztangi poziomo", m: "Klatka środek · triceps", s: [4,4,5,5], r: "5–8", p: 1, warm: 1, rest: "3–4 min", pair: 0, tw: "82,5", tw2: "70", t1: "82,5", w: "Oburącz. Ławka pozioma, łopatki ściągnięte i schowane w dół, pośladki zostają na ławce, stopy płasko pod kolanami. Chwyt ok. 1,5× szerokości barków, sztanga schodzi do dolnej części klatki, łokcie 45–60° od tułowia (nie na boki). Ciężkie złożone — zawsze solo, pełna przerwa." },
    { n: "Wyciskanie hantli skośne 30°", m: "Klatka góra", s: [3,4,4,5], r: "8–12", p: 1, rest: "2–3 min", pair: 2, tw: "34", tw2: "27", t1: "24", w: "Oburącz, obie ręce jednocześnie. Oparcie dokładnie 30° — powyżej 45° ruch przejmuje bark przedni i tracisz sens ćwiczenia. Łopatki ściągnięte, hantle schodzą po bokach klatki do linii sutków, na dole szukasz rozciągnięcia. U góry nie stykaj hantli — napięcie ucieka. W teście 34 kg dało 2 powtórzenia, stąd duży zjazd." },
    { n: "Wiosłowanie sztangą w opadzie", m: "Środek pleców", s: [3,3,3,3], r: "8–12", rest: "2–3 min", pair: 2, tw: "50", tw2: "40", t1: "45", w: "Oburącz. Tułów 30–45° do podłoża, kolana lekko ugięte, plecy neutralne z wypiętą klatką. Chwyt nachwytem na szerokość barków, sztangę ciągniesz do dolnych żeber, łokcie blisko tułowia. Tułów nieruchomy — jak zaczynasz bujać, ciężar jest za duży." },
    { n: "Ściąganie uchwytu z góry jednorącz", m: "Najszerszy (bok pleców)", s: [3,3,3,3], r: "10–15", rest: "90–120 s", pair: 3, tw: "37,5", tw2: "30", t1: "30", w: "Unilateralnie — jedna ręka naraz, siedząc na hammerze, nachwytem. Na starcie pozwól łopatce wyjechać w górę (pełne rozciągnięcie najszerszego), potem ściągnij ją w dół i do tyłu, łokieć prowadź do biodra. Wolną ręką trzymaj się siedziska, tułów bez rotacji i bez odchylania." },
    { n: "Prostowanie ramion zza głowy", m: "Triceps — głowa długa", s: [4,5,5,6], r: "10–15", p: 1, rest: "90–120 s", pair: 3, tw: "35", tw2: "28", t1: "28", w: "Oburącz, jedna lina, twarzą od wyciągu, tułów pochylony w przód, ramiona przy uszach. Łokcie nieruchome przez cały ruch — zgina się tylko łokieć. Zza głowy, bo tylko wtedy głowa długa jest w pełnym rozciągnięciu." },
    { n: "Scarecrows", m: "Bark tylny · rotatory", s: [3,3,3,3], r: "12–20", rest: "60–90 s", pair: 4, tw: "3", tw2: "2,5", t1: "2", w: "Oburącz jednocześnie. Ławka 45–60°, klatką na oparciu, ręce zwisają swobodnie. Ruch 1: przyciągasz łokcie do góry i wypinasz klatkę. Ruch 2: rotacja zewnętrzna — obracasz przedramiona do góry. Wracając możesz zaokrąglić górę pleców i rozciągnąć tył barku. Ciężar celowo mały — to stożek rotatorów, nie siłowanie." },
    { n: "Uginanie przedramion sztangą prostą", m: "Biceps", s: [2,2,2,2], r: "8–12", rest: "60–90 s", pair: 4, tw: "32", tw2: "25,5", t1: "27,5", w: "Oburącz, stojąc. Prosta sztanga, nie łamana — to jedyny ruch w pełnej supinacji w tym bloku. Chwyt na szerokość barków, łokcie przy tułowiu i nieruchome, tułów bez odchylania się do tyłu." },
    { n: "Wznosy bokiem z hantlem", m: "Bark boczny", s: [3,3,3,3], r: "12–20", rest: "60–90 s", pair: 0, tw: null, tw2: null, t1: "8", w: "Unilateralnie — jedna ręka naraz, na przemian. Stoisz, hantel przy udzie, tułów nieruchomy. Prowadzisz łokciem, nie dłonią; łokieć lekko ugięty przez cały ruch. Zatrzymujesz się dokładnie na linii barku, nie wyżej — zero zamachu biodrami i tułowiem. Opuszczaj tak samo kontrolowanie jak podnosisz, bez swobodnego spadku. Zmiana z wyciągu (skoki co 5 kg nie dawały czystej kalibracji); ustal ten standard wykonania i trzymaj go przez cały blok, żeby liczby powtórzeń były porównywalne tydzień do tygodnia." },
  ],
  B: [
    { n: "Przysiad ze sztangą na barkach", m: "Czworogłowe · pośladki", s: [4,4,4,4], r: "6–10", warm: 1, rest: "3–4 min", pair: 0, tw: "70", tw2: "52", t1: "65", w: "Obunóż. Sztanga wysoko na kapturach (high bar), stopy na szerokość barków lub odrobinę szerzej, palce 15–30° na zewnątrz, kolana śledzą linię stóp. Schodzisz co najmniej do równoległości ud. Solo, pełna przerwa." },
    { n: "Wypychanie bioder ze sztangą", m: "Pośladkowy wielki", s: [4,5,5,6], r: "8–12", p: 1, rest: "2–3 min", pair: 0, tw: "70", tw2: "56", t1: "70", w: "Obunóż — świadomie, bo przy jednonóż limitem była stabilizacja, nie pośladek. Łopatki oparte o krawędź ławki ok. 40 cm, stopy tak daleko, żeby na górze podudzie stało pionowo. Broda schowana, żebra w dół, na szczycie pełny wyprost bioder i sekunda spięcia." },
    { n: "Martwy ciąg rumuński", m: "Dwugłowe uda · pośladki", s: [3,3,3,3], r: "8–12", rest: "2–3 min", pair: 2, tw: "90", tw2: "72,5", t1: "75", w: "Oburącz, start z góry. Kolana lekko ugięte i przez cały ruch nieruchome, biodra jadą do tyłu, sztanga sunie po udach. Schodzisz do momentu, w którym plecy zaczynają się zaokrąglać — u większości tuż poniżej kolan. Ruch dzieje się w biodrze, nie w kręgosłupie." },
    { n: "Wspięcia na łydki stojąc", m: "Brzuchaty łydki", s: [3,3,4,4], r: "10–15", rest: "60–90 s", pair: 2, tw: "70", tw2: "56", t1: "60", w: "Obunóż. Kolano proste przez cały ruch — to warunek, żeby pracował brzuchaty. Śródstopie na krawędzi podestu, pięta schodzi maksymalnie nisko z sekundą pauzy, w górę pełne wspięcie bez odbijania." },
    { n: "Uginanie podudzi leżąc", m: "Dwugłowe uda — obunóż", s: [3,3,3,3], r: "10–15", rest: "90–120 s", pair: 3, tw: "40", tw2: "31,5", t1: "32,5", w: "Obunóż — tak jak robiłeś w teście, plan zakładał błędnie jednonóż. Biodra dociśnięte do ławki, oś maszyny na wysokości kolana, wałek nad ścięgnem Achillesa, palce ściągnięte do siebie. Nie odrywaj bioder na końcu ruchu." },
    { n: "Przyciąganie kolan w zwisie", m: "Brzuch dolny", s: [3,3,3,3], r: "12–20", rest: "60–90 s", pair: 3, tw: null, tw2: null, t1: null, w: "Obunóż, zwis na drążku. Kolana mocno ugięte. Ruch zaczyna się od podwinięcia miednicy — ogon do żeber — a dopiero potem jedzie biodro. Bez rozbujania: jeśli się bujasz, pracuje zginacz biodra, nie brzuch. W teście wyszło 6 powtórzeń, celuj w dojście do 12 w tygodniu 3–4." },
  ],
  C: [
    { n: "Pompki na poręczach z obciążeniem", m: "Klatka dół · triceps", s: [3,4,4,5], r: "8–12", p: 1, warm: 1, rest: "2–3 min", pair: 0, tw: "+25", tw2: "+20", t1: "+7,5", w: "Oburącz, obciążenie na pasie. Tułów pochylony 20–30° w przód — w pionie ćwiczenie robi się tricepsowe, pochylenie przesuwa je na dolną klatkę. Łokcie lekko na zewnątrz, schodzisz do kąta prostego w łokciu lub głębiej, jeśli bark na to pozwala bez bólu." },

/* Warstwa zapisu: najpierw mechanizm Claude, potem pamiec przegladarki */
const S={mode:'none',
 async init(){
  if(window.storage&&typeof window.storage.set==='function'){
   try{await window.storage.set('rp_probe','1');this.mode='claude';return;}catch(e){}}
  try{localStorage.setItem('rp_probe','1');this.mode='local';return;}catch(e){}
  this.mode='none';},
 async get(k){
  try{
   if(this.mode==='claude'){const r=await window.storage.get(k);return r?r.value:null;}
   if(this.mode==='local')return localStorage.getItem(k);
  }catch(e){}
  return null;},
 async set(k,v){
  if(this.mode==='claude'){await window.storage.set(k,v);return;}
  if(this.mode==='local'){localStorage.setItem(k,v);return;}
  throw new Error('brak zapisu');}
};
let W='1', D='A', log={}, waga={}, kolejka=[];
const ENDPOINT='https://script.google.com/macros/s/AKfycbylgrHYXhqqLJwxKGD7VhpEMdjf-TrDMMFnQfF8qREdr44vnPQOXbcsD-fbdOr8VqFZ/exec';
const dzis=()=>new Date().toISOString().slice(0,10);

function kolejkuj(payload){
  kolejka.push(payload);
  try{ S.set('rp_queue',JSON.stringify(kolejka)); }catch(e){}
  wyslij();
}
let wysylanie=false;
async function wyslij(){
  if(wysylanie||!kolejka.length) return;
  if(!navigator.onLine){ pill(kolejka.length+' w kolejce','warn'); return; }
  wysylanie=true;
  while(kolejka.length){
    const p=kolejka[0];
    try{
      await fetch(ENDPOINT,{method:'POST',mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
      kolejka.shift();
      try{ await S.set('rp_queue',JSON.stringify(kolejka)); }catch(e){}
    }catch(e){ pill(kolejka.length+' w kolejce','warn'); wysylanie=false; return; }
  }
  wysylanie=false;
  pill('w arkuszu','ok');
}
window.addEventListener('online',wyslij);

/* --- pobranie danych z arkusza: odtwarza wpisy po podmianie kodu --- */
async function pobierzZArkusza(){
  if(!navigator.onLine) return;
  pill('pobieram\u2026','warn');
  try{
    const r=await fetch(ENDPOINT+'?akcja=pobierz',{method:'GET'});
    const j=await r.json();
    if(!j.ok) throw 0;
    let n=0;
    (j.trening||[]).forEach(row=>{
      const wk=(WEEKS.find(x=>x.label===row.tydzien)||{}).id; if(!wk) return;
      const dz=row.dzien; if(!PLAN[dz]) return;
      const i=PLAN[dz].findIndex(e=>e.n===row.cwiczenie); if(i<0) return;
      const j2=parseInt(row.seria)-1; if(isNaN(j2)||j2<0) return;
      const id=wk+'_'+dz+'_'+i;
      log[id]=log[id]||{}; log[id][j2]=log[id][j2]||{};
      if(!log[id][j2].kg){ log[id][j2].kg=String(row.ciezar); log[id][j2].rp=String(row.powt); n++; }
    });
    if(j.waga&&j.waga.length){
      waga.d=waga.d||{}; waga.p=waga.p||{};
      j.waga.forEach(function(x){
        const dt=String(x.data||'').slice(0,10);
        if(!dt) return;
        if(x.waga && !waga.d[dt]) waga.d[dt]=String(x.waga);
        if(x.pas  && !waga.p[dt]) waga.p[dt]=String(x.pas);
      });
    }
    await S.set('rp_log',JSON.stringify(log));
    await S.set('rp_waga',JSON.stringify(waga));
    pill(n?('odtworzono '+n):'aktualne','ok');
    render();
  }catch(e){ pill('brak pobrania','warn'); }
}

}

function syncSeria(id,j){
  const d=(log[id]||{})[j]; if(!d||!d.kg||!d.rp) return;

const TRENING=['A','B','C','D'];
function render(){
  const wTren = TRENING.indexOf(D)>=0;
  const wPom  = D==='W';

  /* poziom 1 — sekcje */
  const TOP=[['tren','Trening','mezocykl'],['W','Pomiary','waga i pas'],
             ['J','Dieta','posiłki'],['K','Jedzenie','kalkulator'],['P','Plan','zasady']];
  document.getElementById('top').innerHTML=TOP.map(function(t){
    const on = t[0]==='tren' ? wTren : D===t[0];
    return '<div class="dy '+(on?'on':'')+'" onclick="setD(\''+(t[0]==='tren'?'A':t[0])+'\')">'+
      t[1]+'<small>'+t[2]+'</small></div>';}).join('');

  /* poziom 2 — tygodnie (trening i pomiary) */
  const wk=document.getElementById('weeks');
  wk.style.display = (wTren||wPom) ? 'flex' : 'none';
  wk.innerHTML = (wTren||wPom) ? WEEKS.map(function(w){
    return '<div class="wk '+(w.type==='dload'?'dl':'')+' '+(w.type==='test'?'tt':'')+' '+
      (w.id===W?'on':'')+'" onclick="setW(\''+w.id+'\')">'+w.label+'</div>';}).join('') : '';

  /* poziom 3 — dni treningowe */
  const dz=document.getElementById('days');
  dz.style.display = wTren ? 'flex' : 'none';
  dz.innerHTML = wTren ? DAYS.map(function(d){
    return '<div class="dy '+(d.id===D?'on':'')+'" onclick="setD(\''+d.id+'\')">'+
      d.id+' \u00b7 '+d.name+'<small>'+d.tag+'</small></div>';}).join('') : '';

  document.getElementById('main').innerHTML =
    D==='P'? planHTML() : D==='W'? wagaHTML() : D==='K'? kalkHTML() : D==='J'? dietaHTML() : sessHTML();
}

const timery={};
function updUw(id,v){
  log[id]=log[id]||{}; log[id].uw=v; save();
  clearTimeout(timery['u'+id]);
  timery['u'+id]=setTimeout(function(){ syncUwagi(id); },1800);
}
function syncUwagi(id){
  const [wk,dz,i]=id.split('_'); const ex=PLAN[dz][+i]; if(!ex) return;
  const w=WEEKS.find(x=>x.id===wk)||{};
  const dane=log[id]||{}; const isT=wk==='t';
  const rows=[];
  Object.keys(dane).forEach(function(j){
    if(isNaN(+j)) return;
    const d=dane[j]; if(!d||!d.kg||!d.rp) return;
    const tag=(isT&&ex.tw)?(+j===0?'seria T':'po \u221220%'):'';
    rows.push({data:dzis(),tydzien:w.label||wk,dzien:dz,cwiczenie:ex.n,seria:String(+j+1),
      ciezar:d.kg,powt:d.rp,rir:w.rir||'',uwagi:[tag,dane.uw].filter(Boolean).join(' \u00b7 ')});
  });
  if(rows.length) kolejkuj({type:'trening',rows:rows});
}
function upd(id,j,f,v){
  (log[id]=log[id]||{}); (log[id][j]=log[id][j]||{}); log[id][j][f]=v; save();
  const k=id+'_'+j;
  clearTimeout(timery[k]);
  timery[k]=setTimeout(()=>syncSeria(id,j),1500);
}
function syncSeria(id,j){
  const d=(log[id]||{})[j]; if(!d||!d.kg||!d.rp) return;
  const [wk,dz,i]=id.split('_'); const ex=PLAN[dz][+i]; if(!ex) return;
  const w=WEEKS.find(x=>x.id===wk)||{};
  const isT=wk==='t';
  kolejkuj({type:'trening',rows:[{data:dzis(),tydzien:w.label||wk,dzien:dz,cwiczenie:ex.n,
    seria:String(j+1),ciezar:d.kg,powt:d.rp,rir:w.rir||'',
    uwagi:[(isT&&ex.tw)?(j===0?'seria T':'po \u221220%'):'', (log[id]||{}).uw].filter(Boolean).join(' \u00b7 ')}]});
}

function obrazki(dz,i,nazwa){
  const baza=dz+String(i+1).padStart(2,'0');
  let im='';
  ['','-b','-c'].forEach(function(suf){
    im+='<img data-src="'+baza+suf+'.png" data-baza="'+baza+suf+'" data-krok="0" '+
        'style="width:100%;border-radius:9px;display:block;margin-bottom:6px" '+
        'onerror="nastepny(this)">';
  });
  return '<div>'+im+'</div>'+opisyMiesni(nazwa);
}
function rozwin(el){
  const inf=el.parentNode.querySelector('.info');
  inf.classList.toggle('on');
  if(inf.classList.contains('on')){
    inf.querySelectorAll('img[data-src]').forEach(function(im){
      im.src=im.getAttribute('data-src'); im.removeAttribute('data-src');
    });
  }
}

/* próbuje po kolei: .png -> .jpg -> .jpeg -> ukryj; jeśli żaden nie wszedł, pokaż schemat */
function nastepny(el){
  const pelna=el.getAttribute('data-baza');
  let k=parseInt(el.getAttribute('data-krok'))+1;
  el.setAttribute('data-krok',k);
  if(k===1){ el.src=pelna+'.jpg';  return; }
  if(k===2){ el.src=pelna+'.jpeg'; return; }
  el.style.display='none';
}

function opisyMiesni(nazwa){
  const lista=EXA[nazwa]; if(!lista) return '';
  const seen={}; let out='';
  lista.forEach(function(p){
    const R=REG[p[0]], akt=p[1]; if(!R) return;
    R.m.forEach(function(m){
      if(seen[m[0]]) return; seen[m[0]]=1;
      const on=akt.indexOf(m[0])>=0;
      if(!on) return;
      out+='<div style="display:flex;gap:7px;align-items:flex-start;padding:2.5px 0">'+
        '<span style="flex:0 0 9px;height:9px;border-radius:2px;margin-top:4px;background:'+AKT+'"></span>'+
        '<span style="font-size:11.5px;line-height:1.35"><b style="color:#F1F5F9">'+m[1]+'</b>'+
        '<span style="display:block;color:#64748B;font-size:10.5px">'+m[2]+'</span></span></div>';
    });
  });
  return out?('<div style="background:rgba(15,23,42,.5);border-radius:9px;padding:8px 10px;margin-bottom:6px">'+out+'</div>'):'';
}
function anatomia(nazwa){
  const lista=EXA[nazwa]; if(!lista) return '';
  return lista.map(function(p){
    const R=REG[p[0]], akt=p[1]; if(!R) return '';
    const opisy=R.m.map(function(m){
      const on=akt.indexOf(m[0])>=0;
      return '<div style="display:flex;gap:7px;align-items:flex-start;padding:2.5px 0;'+(on?'':'opacity:.45')+'">'+
        '<span style="flex:0 0 9px;height:9px;border-radius:2px;margin-top:4px;background:'+(on?AKT:NIE)+'"></span>'+
        '<span style="font-size:11.5px;line-height:1.35"><b style="color:'+(on?'#F1F5F9':'#94A3B8')+'">'+m[1]+'</b>'+
        '<span style="display:block;color:#64748B;font-size:10.5px">'+m[2]+'</span></span></div>';
    }).join('');
    return '<div style="background:rgba(15,23,42,.5);border-radius:9px;padding:8px 10px;margin-bottom:8px">'+
      '<div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#64748B;margin-bottom:3px">'+R.t+'</div>'+
      R.svg(akt)+'<div style="margin-top:6px">'+opisy+'</div></div>';
  }).join('');
}

function sessHTML(){
  const w=WEEKS.find(x=>x.id===W); let b='';
  if(w.type==='test') b='<div class="banner test"><b>Tydzie\u0144 testowy.</b> Seria <b>T</b> \u2014 ci\u0119\u017car submaksymalny, dojd\u017a blisko 1 RIR. Potem zdejmij 20% (<b>\u221220</b>) i reszt\u0119 r\u00f3b na maksa. Liczby to propozycje z Twojej historii \u2014 nadpisz, je\u015bli wyjdzie inaczej.<br><br><b>Na tydzie\u0144 1:</b> ten sam ci\u0119\u017car co w serii T, ale zatrzymuj si\u0119 3\u20134 powt\u00f3rzenia wcze\u015bniej.</div>';
  else if(w.type==='dload') b='<div class="banner dload"><b>Deload.</b> Po\u0142owa serii, ~60% ci\u0119\u017caru, RIR <span class="rir">4\u20135</span>. Masz wyj\u015b\u0107 z poczuciem, \u017ce nic nie zrobi\u0142e\u015b \u2014 to zamierzone.</div>';
  else b='<div class="banner">Cel na ten tydzie\u0144: <b>RIR</b> <span class="rir">'+w.rir+'</span> \u2014 tyle powt\u00f3rze\u0144 zostawiasz w zapasie. Ci\u0119\u017car ten sam we wszystkich seriach, powt\u00f3rzenia b\u0119d\u0105 spada\u0107.</div>';
  b+='<div class="legend"><span class="k" style="background:var(--purple)"></span><b style="color:var(--ink)">Fioletowy pasek</b> \u2014 priorytet bloku (klatka, triceps, po\u015bladki). Tylko tym rosn\u0105 serie.<br><span class="k" style="background:#93C5FD"></span><span class="k" style="background:#6EE7B7"></span><span class="k" style="background:#FCD34D"></span><b style="color:var(--ink)">Superserie</b> \u2014 ten sam kolor = robisz na przemian, pe\u0142na przerwa po parze.</div>';
  const isT = W==='t';
  return b+PLAN[D].map((ex,i)=>{
    const id=W+'_'+D+'_'+i, ns=nSets(ex);
    let rows='';
    for(let j=0;j<ns;j++){
      const d=(log[id]||{})[j]||{};
      const tag = isT&&ex.tw ? (j===0?'T':'\u221220') : (j+1);
      const ph  = isT&&ex.tw ? (j===0?ex.tw:ex.tw2) : (W==='1'&&ex.t1 ? ex.t1 : 'kg');
      rows+='<div class="row"><span class="i">'+tag+'</span>'+
        '<input inputmode="decimal" placeholder="'+ph+'" value="'+(d.kg||'')+'" oninput="upd(\''+id+'\','+j+',\'kg\',this.value)">'+
        '<input inputmode="numeric" placeholder="powt" value="'+(d.rp||'')+'" oninput="upd(\''+id+'\','+j+',\'rp\',this.value)"></div>';
    }
    let prev='';

        row('Mleko sojowe','',300+' ml','wnosi 9 g B, 5,4 g T')+
        row('Cynamon','','szczypta','')+
        grp('Owoce','wybierz jedno')+OW.map(o=>row(o[0],'',r5(20/(o[1]/100))+' g','')).join('')+
        grp('Białko','do dobrania: '+nB+' g')+
        row('Odżywka białkowa','',r5(nB/0.8)+' g','')+row('Skyr naturalny','',r5(nB/0.11)+' g','')+
        grp('Tłuszcze','do dodania: '+nT+' g')+f+'</div>';
    } else if(typ==='szejk'){
      jedna=true;
      body='<div class="dv">'+
        grp('Baza','')+row('Mleko sojowe','','300 ml','wnosi 9 g B, 5,4 g T')+
        grp('Owoce','wybierz jedno')+OW.map(o=>row(o[0],'',r5(20/(o[1]/100))+' g','')).join('')+
        grp('Białko','do dobrania: 15 g')+
        row('Odżywka białkowa','','20 g','')+row('Skyr naturalny','','135 g','')+row('Jajka','','3 szt.','')+
        grp('Tłuszcze','do dodania: 10 g · zmielone nasiona')+
        row('Nasiona chia','','32 g','')+row('Siemię lniane mielone','','24 g','')+row('Orzechy włoskie','','15 g','')+
        '<div class="dnote">Ten tłuszcz jest odjęty od posiłku potreningowego — dlatego ma on cel 15 g zamiast 25 g.</div></div>';
    } else {
      body=wariant('Bez strączków','var(--acc)',W,B,T,wg,false)+
           wariant('Ze strączkami','#5B4A7A',W,B,T,wg,true);

  out+='<div class="legend">Warzywa: zielone liściaste codziennie (szpinak, jarmuż, rukola 100 g), '+

function kalkAdd(){

    const q=(waga.d&&waga.d[d.toISOString().slice(0,10)]); if(q) vals.push(parseFloat(q));}

    const p=new Date(pon); p.setDate(pon.getDate()+offset*7);

    return v.length ? {sr:v.reduce((a,b)=>a+b,0)/v.length, n:v.length} : null;
  }
  function pasTyg(offset){
    const p=new Date(pon); p.setDate(pon.getDate()+offset*7);
    const q=(waga.p||{})[p.toISOString().slice(0,10)];
    return q?parseFloat(q):null;
  }
  const teraz=sredniaTyg(0), przed=sredniaTyg(-1);

    const dP=(pasT!==null&&pasP!==null)?(pasT-pasP):null;

    } else {
      kol='var(--ok)'; tyt='Tempo trafione — nic nie zmieniaj';
      tekst='Przyrost '+dW.toFixed(2)+' kg mieści się w celu 0,10–0,28 kg/tydzień.';
    }
    if(dP!==null && dP>0.7 && dW<=0.28){
      kol='var(--warn)'; tyt='Pas rośnie szybciej niż masa';
      tekst='Waga +'+dW.toFixed(2)+' kg, ale pas +'+dP.toFixed(1)+' cm. To sygnał, że przyrost idzie w tłuszcz — odejmij <b>−25 g węglowodanów</b>.';
    }
    ocena='<div class="ex"><div class="sets" style="padding:11px">'+
      '<div style="font-family:Barlow Condensed;font-size:16px;font-weight:700;color:'+kol+'">'+tyt+'</div>'+
      '<div style="font-size:12px;color:var(--soft);line-height:1.55;margin-top:5px">'+tekst+'</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);text-align:center">'+
      '<div><div style="font-size:10px;color:var(--soft);text-transform:uppercase">poprzedni</div>'+
        '<div style="font-family:Barlow Condensed;font-size:18px;font-weight:700">'+przed.sr.toFixed(2)+'</div></div>'+
      '<div><div style="font-size:10px;color:var(--soft);text-transform:uppercase">teraz</div>'+
        '<div style="font-family:Barlow Condensed;font-size:18px;font-weight:700">'+teraz.sr.toFixed(2)+'</div></div>'+
      '<div><div style="font-size:10px;color:var(--soft);text-transform:uppercase">zmiana</div>'+
        '<div style="font-family:Barlow Condensed;font-size:18px;font-weight:700;color:'+kol+'">'+(dW>=0?'+':'')+dW.toFixed(2)+'</div></div>'+
      '</div>'+
      (dP!==null?'<div class="prev" style="padding-top:7px">pas: '+pasP.toFixed(1)+' \u2192 '+pasT.toFixed(1)+' cm ('+(dP>=0?'+':'')+dP.toFixed(1)+')</div>':'')+
      '</div></div>';
  } else if(teraz && !przed){
    ocena='<div class="legend">Ocena tempa pojawi si\u0119 po drugim tygodniu \u2014 potrzebne s\u0105 dwie \u015brednie do por\u00f3wnania.</div>';
  }

  return '<div class="banner"><b>'+w.label+'</b> \u2014 tydzie\u0144 od '+isoPon+'. Wa\u017c si\u0119 rano na czczo, po toalecie. '+
    'Liczy si\u0119 <b>\u015brednia tygodniowa</b>, nie pojedynczy pomiar.</div>'+
    '<div class="ex"><div class="sets" style="padding-top:11px">'+
    '<div class="lbl" style="grid-template-columns:42px 1fr 1fr"><span></span><span>data</span><span>waga (kg)</span></div>'+
    rows+
    (vals.length?'<div class="prev" style="padding-top:8px">\u015arednia z '+vals.length+' pomiar\u00f3w: <b style="color:var(--acc)">'+sr.toFixed(2)+' kg</b></div>':'')+
    '</div></div>'+
    '<div class="ex"><div class="sets" style="padding-top:11px">'+
    '<div class="lbl" style="grid-template-columns:1fr 1fr"><span>obw\u00f3d pasa \u2014 raz w tygodniu</span><span>cm</span></div>'+
    '<div class="row" style="grid-template-columns:1fr 1fr">'+
    '<span style="font-size:11.5px;color:var(--soft);align-self:center">pomiar w '+isoPon.slice(5)+'</span>'+
    '<input inputmode="decimal" placeholder="79" value="'+pas+'" oninput="updPas(\''+isoPon+'\',this.value)"></div>'+
    '</div></div>'+
    ocena+
    '<div class="legend">Cel: <b style="color:var(--ink)">+0,14 kg tygodniowo</b>, ok. 0,6 kg miesi\u0119cznie. '+
    'Ocena por\u00f3wnuje \u015bredni\u0105 tego tygodnia ze \u015bredni\u0105 poprzedniego.</div>';
}
function updDzien(iso,v){
  waga.d=waga.d||{}; waga.d[iso]=v;
  S.set('rp_waga',JSON.stringify(waga)).catch(function(){});
  clearTimeout(updDzien['t'+iso]);
  updDzien['t'+iso]=setTimeout(function(){
    if(!v) return;
    kolejkuj({type:'waga',data:iso,waga:v,pas:(waga.p&&waga.p[iso])||'',uwagi:''});
  },1500);
}
function updPas(iso,v){
  waga.p=waga.p||{}; waga.p[iso]=v;
  S.set('rp_waga',JSON.stringify(waga)).catch(function(){});
  clearTimeout(updPas['t'+iso]);
  updPas['t'+iso]=setTimeout(function(){
    if(!v) return;
    kolejkuj({type:'waga',data:iso,waga:(waga.d&&waga.d[iso])||'',pas:v,uwagi:''});
  },1500);
}
function planHTML(){return '<div class="doc">'+
'<h2>Struktura bloku</h2><p>Sze\u015b\u0107 tygodni: <b>tydzie\u0144 testowy</b>, cztery tygodnie akumulacji, <b>deload</b>. Potem nast\u0119pny mezocykl od nowa, z ci\u0119\u017carami z ostatniego tygodnia.</p>'+
'<table><tr><th>Tydzie\u0144</th><th>Serie</th><th>RIR</th></tr>'+
'<tr><td>Testowy</td><td class="n">3</td><td class="n">\u2014</td></tr>'+
'<tr><td>1</td><td class="n">bazowe</td><td class="n">3\u20134</td></tr>'+
'<tr><td>2</td><td class="n">+1 na priorytetach</td><td class="n">2\u20133</td></tr>'+
'<tr><td>3</td><td class="n">+1</td><td class="n">1\u20132</td></tr>'+
'<tr><td>4</td><td class="n">+1</td><td class="n">0\u20131</td></tr>'+
'<tr><td>Deload</td><td class="n">po\u0142owa</td><td class="n">4\u20135</td></tr></table>'+
'<h2>Co to jest RIR</h2><p><b>Reps in reserve</b> \u2014 ile powt\u00f3rze\u0144 zostawiasz w zapasie. Nie robisz serii do upadku, bo wtedy kolejne si\u0119 sypi\u0105 i tracisz obj\u0119to\u015b\u0107, kt\u00f3ra jest g\u0142\u00f3wnym motorem wzrostu.</p>'+
'<p>Rozpoznajesz to <b>po tempie, nie po odczuciu</b>: gdy pr\u0119dko\u015b\u0107 wyra\u017anie spada mimo maksymalnego wysi\u0142ku, jeste\u015b przy 1\u20132 RIR. Wi\u0119kszo\u015b\u0107 ludzi przeszacowuje wysi\u0142ek \u2014 je\u015bli nie masz pewno\u015bci, za\u0142\u00f3\u017c, \u017ce zostawiasz wi\u0119cej.</p>'+
'<h2>Jak zachowuj\u0105 si\u0119 serie</h2><p><b>Ten sam ci\u0119\u017car we wszystkich seriach.</b> Powt\u00f3rzenia b\u0119d\u0105 spada\u0107 \u2014 8, 7, 7, 6 to prawid\u0142owy przebieg.</p>'+
'<p><b>Ci\u0119\u017car dok\u0142adasz</b>, gdy trafisz g\u00f3rn\u0105 granic\u0119 zakresu we wszystkich seriach przy za\u0142o\u017conym RIR. <b>Zdejmujesz</b>, gdy spadasz poni\u017cej dolnej granicy \u2014 to nie sygna\u0142 do deloadu, tylko \u017ce ci\u0119\u017car jest za du\u017cy.</p>'+
'<h2>Dlaczego serie rosn\u0105</h2><p>Organizm przyzwyczaja si\u0119 do bod\u017aca. Startujesz od <b>MEV</b>, przechodzisz przez <b>MAV</b> i ko\u0144czysz przy <b>MRV</b> \u2014 granicy regeneracji. Gdyby\u015b startowa\u0142 od razu wysoko, nie mia\u0142by\u015b dok\u0105d i\u015b\u0107.</p>'+
'<h2>Specjalizacja bloku</h2><p>Priorytet: <b>klatka 16\u219223 serii</b>, <b>triceps 8\u219212</b>, <b>po\u015bladki 7\u219211</b>. P\u0142ac\u0105 za to plecy (14\u219212), bark boczny (8\u21926) i biceps (6\u21924) \u2014 przy podtrzymaniu nie tracisz masy.</p>'+
'<h2>Supersety</h2><p>Ci\u0119\u017ckie z\u0142o\u017cone zawsze solo. W tygodniach 1\u20133 \u0142\u0105cz spokojnie, w tygodniu 4 roz\u0142\u0105czaj \u2014 blisko MRV ka\u017cda seria ma by\u0107 wykonana najlepiej jak si\u0119 da.</p>'+
'<h2>Kopia danych</h2><p>Dane zapisuj\u0105 si\u0119 w tej przegl\u0105darce. Skopiuj je przed zmian\u0105 telefonu albo czyszczeniem danych.</p>'+
'<button class="btn g" onclick="exp()">Skopiuj kopi\u0119 do schowka</button>'+
'<button class="btn" onclick="document.getElementById(\'imp\').style.display=\'block\'">Wklej kopi\u0119</button>'+
'<div id="imp" style="display:none"><textarea id="ta" placeholder="wklej tutaj"></textarea>'+
'<button class="btn" onclick="doImp()">Wczytaj</button></div></div>';}
